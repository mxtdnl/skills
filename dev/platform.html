<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform harness (developer)</title>
<!-- Developer harness for the S3 platform skeleton. Not student-facing. Minimal styling only:
     the design system arrives in S4 and the hub in S5. Must be served over HTTP. -->
<style>
:root { --bg: #F2DFBE; --bg-card: #FFFAF2; --text: #2A1F18; --border: #D8C8A8; --accent-1: #5C3A96; --accent-2: #B52838; --accent-4: #D4A020; --ambiguous: #B98A10; --ambiguous-tint: #FFF3D6; }
body { margin: 0; padding: 1rem; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.5; }
main { max-width: 44rem; margin: 0 auto; }
.btn { background: var(--accent-1); color: #fff; border: 0; border-radius: 0; padding: 0.7rem 1rem; margin: 0.25rem; font: inherit; font-weight: 700; min-height: 44px; cursor: pointer; }
.btn:hover { background: var(--accent-2); }
.btn:focus-visible, a:focus-visible, h1:focus-visible { outline: 4px solid var(--accent-4); outline-offset: 3px; }
fieldset { border: 2px solid var(--border); background: var(--bg-card); padding: 1rem; }
.notice { background: var(--ambiguous-tint); border-left: 6px solid var(--ambiguous); padding: 0.75rem 1rem; }
pre { background: var(--bg-card); border: 2px solid var(--border); padding: 1rem; overflow: auto; font-size: 0.8rem; }
.small { font-size: 0.9rem; }
</style>
<script type="module" src="platform.js"></script>
</head>
<body>
<noscript>This page needs JavaScript, and must be opened through a local web server, not from a file.</noscript>
<main id="app"></main>
</body>
</html>
